  const ja=(v)=>`<option value="ja" ${v?'selected':''}>ja</option><option value="nee" ${v?'':'selected'}>nee</option>`;
  return `<tr>
    <td class="naam"><button class="linkje" data-edit="${m.id}" title="Recept en hoeveelheden bewerken">${esc(m.naam)}</button>${state.overrides&&state.overrides[m.id]?' <span class="chip prep">aangepast</span>':''}</td>
    <td><input type="number" min="0" max="240" value="${m.tijd}" data-mid="${m.id}" data-veld="tijd"></td>
    <td><select data-mid="${m.id}" data-veld="eiwit"><option ${m.eiwit==='hoog'?'selected':''}>hoog</option><option ${m.eiwit==='gemiddeld'?'selected':''}>gemiddeld</option></select></td>
    <td><select data-mid="${m.id}" data-veld="bron">${['kip','rund','varken','kalkoen','vis','garnaal','ei','peulvrucht','tofu','kaas','gemengd'].map(b=>`<option ${m.bron===b?'selected':''}>${b}</option>`).join('')}</select></td>
    <td><select data-mid="${m.id}" data-veld="slots">
      <option value="diner" ${m.slots.join()==='diner'?'selected':''}>avond</option>
      <option value="lunch" ${m.slots.join()==='lunch'?'selected':''}>middag</option>
      <option value="lunch,diner" ${m.slots.length===2?'selected':''}>beide</option></select></td>
    <td><select data-mid="${m.id}" data-veld="prep">${ja(m.prep)}</select></td>
    <td><select data-mid="${m.id}" data-veld="opwarm">${ja(m.opwarm)}</select></td>
    <td><select data-mid="${m.id}" data-veld="instant">${ja(m.instant)}</select></td>
    <td><select data-mid="${m.id}" data-veld="alleen">
      <option value="" ${!m.alleen?'selected':''}>elke dag</option>
      <option value="weekend" ${m.alleen==='weekend'?'selected':''}>weekend</option>
      <option value="zondag" ${m.alleen==='zondag'?'selected':''}>zondag</option></select></td>
    <td style="text-align:center"><input type="checkbox" data-use="${m.id}" ${state.disabled[m.id]?'':'checked'}></td>
  </tr>`;
}

function renderMeals(){
  const alles=allMeals();
  const groepen={onze:[],ander:[],bestel:[]};
  alles.forEach(m=>groepen[groepVan(m)].push(m));
  const tabel=state.mealView!=='kaarten';
  let h=formHTML();
  h+=`<div class="weekhead">
    <div class="seg">
      <button data-mv="tabel" aria-pressed="${tabel}">Tabel</button>
      <button data-mv="kaarten" aria-pressed="${!tabel}">Kaarten</button>
    </div>
    <span class="meta">${groepen.onze.length} eigen · ${groepen.ander.length} andere · ${groepen.bestel.length} bestellen</span><span class="rule"></span></div>`;

  if(tabel){
    h+=`<div class="panel" style="padding:12px">
      <p class="hint" style="margin-bottom:10px">Alles is hier rechtstreeks aan te passen. Wijzigingen aan een basisrecept blijven bewaard en overschrijven het origineel niet.</p>
      <div class="tabelwrap"><table class="rtabel">
        <thead><tr><th>Gerecht</th><th>Min</th><th>Eiwit</th><th>Hoofd</th><th>Wanneer</th><th>Vooraf</th><th>Opwarmen</th><th>Meteen</th><th>Enkel</th><th>Aan</th></tr></thead>
        <tbody>${['onze','ander','bestel'].map(g=>groepen[g].length
          ? `<tr class="groeprij"><td colspan="11">${GROEPNAAM[g]}</td></tr>`+groepen[g].map(tabelRij).join('')
          : '').join('')}</tbody>
      </table></div>
    </div>`;
  }else{
    ['onze','ander','bestel'].forEach((g,n)=>{
      if(!groepen[g].length) return;
      if(n) h+=`<div class="weekhead"><h2>${GROEPNAAM[g]}</h2><span class="rule"></span></div>`;
      h+=`<div class="meal-grid">${groepen[g].map(m=>mealCard(m,String(m.id).startsWith('eigen-'))).join('')}</div>`;
    });
  }
  $('#tab-meals').innerHTML=h;

  if($('#cancelrecipe')) $('#cancelrecipe').onclick=()=>{ bewerkId=null; render(); };
  if($('#resetrecipe')) $('#resetrecipe').onclick=()=>{
    if(!confirm('Alle aanpassingen aan dit recept ongedaan maken?')) return;
    delete state.overrides[bewerkId]; bewerkId=null; save(); render(); toast('Origineel hersteld');
  };

  $('#tab-meals').querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
    state.mealView=b.dataset.mv; save(); renderMeals();
  });
  $('#tab-meals').querySelectorAll('[data-mid]').forEach(el=>el.onchange=()=>{
    const id=el.dataset.mid, veld=el.dataset.veld;
    let waarde=el.value;
    if(veld==='tijd') waarde=Math.max(0,Math.min(240,Number(el.value)||0));
    else if(veld==='slots') waarde=el.value.split(',');
    else if(veld==='prep'||veld==='opwarm'||veld==='instant') waarde=(el.value==='ja');
    else if(veld==='alleen') waarde=el.value||undefined;
    const eigenRec=state.custom.find(m=>m.id===id);
    if(eigenRec){ eigenRec[veld]=waarde; }
    else { state.overrides[id]=state.overrides[id]||{}; state.overrides[id][veld]=waarde; }
    save(); renderMeals();
  });
  $('#tab-meals').querySelectorAll('[data-use]').forEach(cb=>cb.onchange=()=>{
    if(cb.checked) delete state.disabled[cb.dataset.use]; else state.disabled[cb.dataset.use]=true;
    save(); renderMeals();
  });
  $('#tab-meals').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
    bewerkId=b.dataset.edit; renderMeals();
    if($('#mealform')) $('#mealform').scrollIntoView({behavior:'smooth',block:'start'});
  });
  $('#tab-meals').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.del;
    if(!confirm('Dit recept verwijderen?')) return;
    state.custom=state.custom.filter(m=>m.id!==id);
    Object.keys(state.plan).forEach(k=>{ if(state.plan[k]&&state.plan[k].mealId===id) state.plan[k]=null; });
    save(); render(); toast('Recept verwijderd');
  });
  $('#tab-meals').querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{
    const src=mealById(b.dataset.copy);
    const kopie=JSON.parse(JSON.stringify(src));
    kopie.id='eigen-'+Date.now(); kopie.naam=src.naam+' (eigen versie)';
    state.custom.push(kopie); bewerkId=kopie.id; save(); renderMeals();
    $('#mealform').scrollIntoView({behavior:'smooth',block:'start'});
  });
}

/* ============================================================
   9. Rendering — Boodschappen
   ============================================================ */
function lijstAlsTekst(){
  const per=boodschappen();
  const dagen=buildDays();
  const titel = dagen[0].date.toLocaleDateString('nl-BE',{day:'numeric',month:'short'})+' – '+dagen[6].date.toLocaleDateString('nl-BE',{day:'numeric',month:'short'});
  const regels=[`Boodschappen — ${titel} (${state.personen} personen)`,''];
  Object.entries(CATS).forEach(([k,label])=>{
    const items=per[k]||[];
    if(!items.some(i=>!inVoorraad(i.n)||state.tochKopen&&state.tochKopen[i.key])) return;
    regels.push(label.toUpperCase());
    items.filter(i=>!inVoorraad(i.n)||state.tochKopen&&state.tochKopen[i.key])
         .forEach(i=>regels.push('- '+i.n+(i.q!=null?' '+fmtQty(i.q,i.u):'')));
    regels.push('');
  });
  return regels.join('\n').trim();
}

async function kopieer(tekst){
  try{
    if(navigator.clipboard&&window.isSecureContext){
      await navigator.clipboard.writeText(tekst);
      return true;
    }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=tekst;
    ta.style.cssText='position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);
    ta.select();
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

function zoekLink(naam){
  const sjabloon=state.zoekUrl||'';
  if(!sjabloon||sjabloon.indexOf('{q}')<0) return '';
  return sjabloon.replace('{q}',encodeURIComponent(naam));
}

function renderShop(){
  const alleenVast=state.shopLocked!==false;
  const per=boodschappen();
  const alleEntries=planEntries();
  const entries=alleEntries.filter(e=>!alleenVast||e.locked);
  const nietVast=alleEntries.filter(e=>!e.locked).length;

  const alle=Object.keys(CATS).map(k=>per[k]||[]).flat();
  const af=alle.filter(i=>state.checked[i.key]).length;
  const pct=alle.length?Math.round(af/alle.length*100):0;

  let h=`<div class="bar">
    <label class="toggle" style="margin-right:4px">
      <input type="checkbox" id="alleenvast" ${alleenVast?'checked':''}> enkel vastgezette maaltijden
    </label>
    <button class="btn ghost" id="kopieer">Lijst kopiëren</button>
    <button class="btn ghost" id="uncheck">Vinkjes wissen</button>
    <button class="btn ghost" id="print">Afdrukken</button>
    <span class="hint" style="margin-left:auto">${af} van ${alle.length} in de kar</span>
  </div>
  <div class="progress"><i style="width:${pct}%"></i></div>`;

  if(alleenVast&&nietVast){
    h+=`<p class="hint" style="margin-top:10px">${nietVast} maaltijd${nietVast>1?'en':''} in deze periode ${nietVast>1?'staan':'staat'} nog niet vast en tel${nietVast>1?'len':'t'} dus niet mee. Zet ze vast met het slotje, of gebruik "Alles vastzetten" op de weektabs.</p>`;
  }

  if(!alle.length){
    h+=`<div class="empty" style="margin-top:18px">${alleenVast
      ? 'Nog niets vastgezet. Zet de maaltijden vast die je zeker gaat maken, dan verschijnen de ingrediënten hier.'
      : 'Nog geen boodschappen. Maak eerst een planning op een van de weektabs.'}</div>`;
  }else{
    h+=`<div class="panel" style="margin-top:16px"><h3>Volledige lijst</h3>
      <p class="hint">Voor ${state.personen} personen, week van ${fmtDate(buildDays()[0].date)} tot ${fmtDate(buildDays()[6].date)}.</p>
      <div class="cats" style="margin-top:14px">`;
    Object.entries(CATS).forEach(([k,label])=>{
      const items=(per[k]||[]).filter(i=>!inVoorraad(i.n)||state.tochKopen&&state.tochKopen[i.key]);
      if(!items.length) return;
      h+=`<div class="cat"><h4>${label}</h4>`;
      items.forEach((i,n)=>{
        const done=!!state.checked[i.key];
        const domId='c_'+k+'_'+n;
        const zl=zoekLink(i.n);
        h+=`<div class="gitem ${done?'done':''}">
          <input type="checkbox" id="${domId}" data-check="${esc(i.key)}" ${done?'checked':''}>
          <label for="${domId}">${esc(i.n)} ${i.q!=null?`<span class="qty">— ${fmtQty(i.q,i.u)}</span>`:''}</label>
          ${zl?`<a class="zoek" href="${esc(zl)}" target="_blank" rel="noopener" title="Zoek ${esc(i.n)} in de winkel">🔍</a>`:''}
        </div>`;
      });
      h+='</div>';
    });
    h+='</div>';
    if(per._kast.length){
      h+=`<div class="kastblok">
        <h4>Staat normaal in huis <span class="hint">(${per._kast.length})</span></h4>
        <p class="hint">Deze staan niet op de lijst. Is er iets op, klik dan op + om het toch mee te kopen.</p>
        <div class="kastlijst">${per._kast.map(i=>`
          <span class="kasttag">${esc(i.n)}${i.q!=null?` <span class="qty">${fmtQty(i.q,i.u)}</span>`:''}
            <button data-kastadd="${esc(i.key)}" title="Toch kopen">+</button></span>`).join('')}</div>
      </div>`;
    }
    const bijgezet=Object.keys(state.kastNodig||{}).length;
    if(bijgezet) h+=`<p class="hint" style="margin-top:8px">${bijgezet} voorraaditem${bijgezet>1?'s':''} staan er extra bij. <button class="btn ghost small" id="kastreset">Terugzetten</button></p>`;
    h+=`<details class="permeal" id="tekstblok"><summary>Lijst als tekst</summary>
      <p class="hint" style="margin-top:8px">Om te plakken in de lijstfunctie van je winkel-app, of om door te sturen.</p>
      <textarea id="lijsttekst" readonly rows="12" style="width:100%;margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:10px;font-family:ui-monospace,monospace;font-size:13px">${esc(lijstAlsTekst())}</textarea>
    </details>`;
    h+='</div>';

    h+=`<div class="panel"><h3>Per maaltijd</h3>
      <p class="hint">Handig als je maar één gerecht wil inkopen of iets wil doorgeven.</p>`;
    entries.forEach(({dag,slot,meal})=>{
      h+=`<details class="permeal"><summary>${dag.naam} ${fmtDate(dag.date)} · ${slot==='lunch'?'middag':'avond'} — ${esc(meal.naam)}</summary>
        <ul class="ing">${meal.ing.map(i=>`<li>${ingLine(i,dag.iso)}</li>`).join('')}</ul></details>`;
    });
    h+='</div>';
  }

  $('#tab-shop').innerHTML=h;
  if($('#kopieer')) $('#kopieer').onclick=async()=>{
    const tekst=lijstAlsTekst();
    if(await kopieer(tekst)) return toast('Lijst gekopieerd');
    const d=$('#tekstblok');
    if(d){ d.open=true; d.scrollIntoView({behavior:'smooth',block:'center'}); $('#lijsttekst').select(); }
    toast('Kopiëren lukt hier niet — selecteer de tekst hieronder.');
  };
  $('#tab-shop').querySelectorAll('[data-kastadd]').forEach(b=>b.onclick=()=>{
    state.kastNodig=state.kastNodig||{};
    state.kastNodig[b.dataset.kastadd]=true;
    save(); renderShop(); toast('Toegevoegd aan de lijst');
  });
  if($('#kastreset')) $('#kastreset').onclick=()=>{ state.kastNodig={}; save(); renderShop(); };
  $('#tab-shop').querySelectorAll('[data-koop]').forEach(b=>b.onclick=()=>{
    state.tochKopen=state.tochKopen||{};
    state.tochKopen[b.dataset.koop]=true;
    save(); renderShop(); toast('Op de lijst gezet');
  });
  $('#alleenvast').onchange=e=>{ state.shopLocked=e.target.checked; save(); renderShop(); };
  $('#uncheck').onclick=()=>{ state.checked={}; save(); renderShop(); };
  $('#print').onclick=()=>window.print();
  $('#tab-shop').querySelectorAll('[data-check]').forEach(cb=>cb.onchange=()=>{
    const k=cb.dataset.check;
    if(cb.checked) state.checked[k]=true; else delete state.checked[k];
    save(); renderShop();
  });
}

/* Deel- en back-upknoppen; gebruikt door het configuratiescherm. */
function bindDelenKnoppen(){
  $('#refresh').onclick=async()=>{
    if(modus==='server'){ await haalOp(); } else { await load(); }
    render(); toast('Laatste versie opgehaald');
  };

  $('#export').onclick=()=>{
    const blob=new Blob([JSON.stringify({versie:1,recepten:state.custom,plan:state.plan,start:state.start,personen:state.personen},null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='whats4dinner-backup.json';
    a.click(); URL.revokeObjectURL(a.href);
  };

  $('#importbtn').onclick=()=>$('#importfile').click();
  $('#importfile').onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      let d; try{ d=JSON.parse(fr.result); }catch(err){ return toast('Dit bestand kon niet gelezen worden.'); }
      const inkomend=Array.isArray(d.recepten)?d.recepten:[];
      const namen=new Set((state.custom||[]).map(m=>m.naam.toLowerCase()));
      let toegevoegd=0;
      inkomend.forEach(m=>{
        if(!m||!m.naam||namen.has(m.naam.toLowerCase())) return;
        m.id='eigen-'+Date.now()+'-'+(toegevoegd++);
        state.custom.push(m); namen.add(m.naam.toLowerCase());
      });
      if(d.plan&&confirm('Ook de planning uit dit bestand overnemen? De huidige planning wordt vervangen.')){
        state.plan=d.plan; if(d.start) state.start=d.start; if(d.personen) state.personen=d.personen;
      }
      save(); render(); toast(toegevoegd+' recept(en) toegevoegd');
    };
    fr.readAsText(f);
  };

  const unitOpts=['g','kg','ml','l','st','el','tl','blik','pot','bosje','sneden','teentjes','rol','snuf',''];
  const rowsEl=$('#ingrows');
  $('#addrow').onclick=()=>{ rowsEl.insertAdjacentHTML('beforeend',ingRow({n:'',q:'',u:'g',c:'groenten'},unitOpts)); bindDel(); };
  function bindDel(){ rowsEl.querySelectorAll('.del').forEach(b=>b.onclick=()=>{ if(rowsEl.children.length>1) b.parentElement.remove(); }); }
  bindDel();

  $('#raadknop').onclick=async()=>{
    const naam=$('#f-naam').value.trim();
    if(!naam) return toast('Vul eerst de naam van het gerecht in.');
    const knop=$('#raadknop');
    knop.disabled=true; const oud=knop.textContent; knop.textContent='Even denken…';
    let r=await raadViaServer(naam);
    knop.disabled=false; knop.textContent=oud;
    if(r&&r.limiet){ toast(r.tekst+' Er wordt nu de ingebouwde lijst gebruikt.'); r=null; }
    if(!r) r=raadIngredienten(naam);
    if(!r.ing.length) return toast('Geen bekende ingrediënten herkend in die naam.');
    const gevuld=[...rowsEl.querySelectorAll('.i-n')].some(x=>x.value.trim());
    if(gevuld&&!confirm('De ingrediëntenlijst wordt vervangen door het voorstel. Doorgaan?')) return;
    rowsEl.innerHTML=r.ing.map(x=>ingRow(x,unitOpts)).join('');
    bindDel();
    if(r.bron) $('#f-bron').value=r.bron;
    if(r.opwarm!==null&&r.opwarm!==undefined) $('#f-opwarm').value=r.opwarm?'ja':'nee';
    if(r.tijd) $('#f-tijd').value=r.tijd;
    if(r.eiwit) $('#f-eiwit').value=r.eiwit;
    if(r.slots) $('#f-slots').value=r.slots;
    if(r.prep!==null&&r.prep!==undefined) $('#f-prep').value=r.prep?'ja':'nee';
    if(r.instant!==null&&r.instant!==undefined) $('#f-instant').value=r.instant?'ja':'nee';
    if(r.alleen!==null&&r.alleen!==undefined) $('#f-alleen').value=r.alleen;
    if(r.tip) $('#f-tip').value=r.tip;
    const rest=r.gebruik?' — nog '+Math.max(0,r.gebruik.limiet-r.gebruik.vandaag)+' vandaag':'';
    toast(r.ing.length+' ingrediënten voorgesteld'+(r.via==='claude'?' door Claude':' uit de woordenlijst')+rest);
  };

  $('#saverecipe').onclick=()=>{
    const naam=$('#f-naam').value.trim();
    if(!naam) return toast('Geef het recept een naam.');
    const ing=[...rowsEl.querySelectorAll('.ingrow')].map(r=>({
      n:r.querySelector('.i-n').value.trim(),
      q:r.querySelector('.i-q').value===''?null:Number(r.querySelector('.i-q').value),
      u:r.querySelector('.i-u').value,
      c:r.querySelector('.i-c').value
    })).filter(i=>i.n);
    if(!ing.length) return toast('Voeg minstens één ingrediënt toe.');
    const rec={
      id:bewerkId||('eigen-'+Date.now()),
      naam, tijd:Number($('#f-tijd').value)||30,
      eiwit:$('#f-eiwit').value, bron:$('#f-bron').value,
      slots:$('#f-slots').value.split(','), prep:$('#f-prep').value==='ja',
      opwarm:$('#f-opwarm').value==='ja', instant:$('#f-instant').value==='ja',
      alleen:$('#f-alleen').value||undefined,
      tip:$('#f-tip').value.trim(), ing
    };
    if(bewerkId&&!String(bewerkId).startsWith('eigen-')){
      // basisrecept: bewaar als aanpassing bovenop het origineel
      const {id,...rest}=rec;
      state.overrides[bewerkId]=rest;
      bewerkId=null;
    }
    else if(bewerkId){ state.custom=state.custom.map(m=>m.id===bewerkId?rec:m); bewerkId=null; }
    else state.custom.push(rec);
    save(); render(); toast('Recept opgeslagen');
  };
  $('#testclaude').onclick=async()=>{
    const uit=$('#testuit'), knop=$('#testclaude');
    knop.disabled=true; uit.textContent='Bezig met testen…';
    const r=await testClaude();
    knop.disabled=false;
    uit.textContent=(r.ok?'✓ ':'✗ ')+r.tekst;
    uit.style.color=r.ok?'var(--pine)':'var(--ball)';
  };

}

/* ============================================================
   9c. Rendering — Wedstrijden
   ============================================================ */
function thuiszaal(wie){
  // de zaal waar iemand het vaakst speelt, is vrijwel zeker de eigen zaal
  const tel={};
  (state.wedstrijden||[]).filter(w=>w.wie===wie&&w.waar).forEach(w=>{ tel[w.waar]=(tel[w.waar]||0)+1; });
  let beste=null,n=0;
  Object.entries(tel).forEach(([z,c])=>{ if(c>n){n=c;beste=z;} });
  return n>=2?beste:null;
}

function renderWedstrijden(){
  const alles=(state.wedstrijden||[]).slice().sort((a,b)=>(a.iso+a.van).localeCompare(b.iso+b.van));
  const vIso=vandaagIso();
  const wie=state.wedFilter||'alle';
  const toonVoorbij=!!state.wedVoorbij;
  const spelers=[...new Set(alles.map(w=>w.wie).filter(Boolean))];
  const lijst=alles.filter(w=>(wie==='alle'||w.wie===wie)&&(toonVoorbij||w.iso>=vIso));

  let h=`<div class="bar">
    <div class="seg">
      <button data-wf="alle" aria-pressed="${wie==='alle'}">Allebei</button>
      ${spelers.map(p=>`<button data-wf="${esc(p)}" aria-pressed="${wie===p}">${esc(p)}</button>`).join('')}
    </div>
    <label class="toggle"><input type="checkbox" id="wedvoorbij" ${toonVoorbij?'checked':''}> ook gespeelde</label>
    <button class="btn ghost" id="wedvernieuw">Vernieuwen</button>
    <span class="hint" style="margin-left:auto">${lijst.length} wedstrijd${lijst.length===1?'':'en'}${
      state.wedstrijdenOpgehaald?' · opgehaald '+new Date(state.wedstrijdenOpgehaald).toLocaleString('nl-BE',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}</span>
  </div>`;

  if(!alles.length){
    h+=`<div class="empty">Nog geen wedstrijden opgehaald. De kalenderlinks staan bij ⋯; klik daar of hierboven op Vernieuwen.</div>`;
  }else if(!lijst.length){
    h+=`<div class="empty">Geen wedstrijden die aan deze selectie voldoen.</div>`;
  }else{
    let maand='';
    lijst.forEach(w=>{
      const d=new Date(w.iso+'T12:00:00');
      const m=d.toLocaleDateString('nl-BE',{month:'long',year:'numeric'});
      if(m!==maand){
        maand=m;
        h+=`<div class="weekhead"><h2 style="font-size:16px;text-transform:capitalize">${esc(m)}</h2><span class="rule"></span></div>`;
      }
      const thuis=thuiszaal(w.wie);
      const isThuis=thuis&&w.waar===thuis;
      const delen=(w.titel||'').split(' - ');
      const tegen=delen.length===2 ? (isThuis?delen[1]:delen[0]) : (w.titel||'');
      const voorbij=w.iso<vIso;
      return h+=`<article class="wedkaart ${voorbij?'voorbij':''}">
        <div class="wk-datum">
          <span class="wk-dag">${d.toLocaleDateString('nl-BE',{weekday:'short'})}</span>
          <span class="wk-nr">${d.getDate()}</span>
        </div>
        <div class="wk-body">
          <div class="wk-top">
            <span class="chip ${isThuis?'prot-hoog':'verg'}">${isThuis?'thuis':'uit'}</span>
            <b>${esc(w.wie)}</b>
            <span class="wk-uur">${w.van}–${w.tot}</span>
          </div>
          <div class="wk-tegen">tegen ${esc(tegen)}</div>
          <div class="wk-zaal">${w.waar?`<a href="${esc(routeLink(w.waar))}" target="_blank" rel="noopener">${esc(w.waar)} ↗</a>`:'zaal onbekend'}
            ${w.waar?`<span class="hint">· ${reistijd(w.waar)} min rijden</span>`:''}</div>
          <div class="wk-vertrek">aanwezig ${aanwezigTijd(w)} · vertrek ${vertrekTijd(w)}</div>
          ${w.link?`<a class="wk-link" href="${esc(w.link)}" target="_blank" rel="noopener">Wedstrijdblad ↗</a>`:''}
        </div>
      </article>`;
    });
  }

  $('#tab-wed').innerHTML=h;
  $('#tab-wed').querySelectorAll('[data-wf]').forEach(b=>b.onclick=()=>{ state.wedFilter=b.dataset.wf; save(); renderWedstrijden(); });
  if($('#wedvoorbij')) $('#wedvoorbij').onchange=e=>{ state.wedVoorbij=e.target.checked; save(); renderWedstrijden(); };
  if($('#wedvernieuw')) $('#wedvernieuw').onclick=async()=>{
    const b=$('#wedvernieuw'); b.disabled=true; b.textContent='Ophalen…';
    const r=await haalWedstrijden();
    toast(r.tekst);
    renderWedstrijden();
  };
}

  if(actief==='overzicht') renderOverzicht();

function toonTab(sleutel){
  actief=sleutel;

  ['vandaag','plan','meals','shop','wed','config'].forEach(id=>$('#tab-'+id).hidden=(id!==zichtbaar));
  render();
}

  if(!state.trainingen) state.trainingen=TRAINING_STANDAARD.map(t=>Object.assign({},t));
  if(!state.vakanties) state.vakanties=VAKANTIES_STANDAARD.map(v=>Object.assign({},v));
  if(!state.kalenders) state.kalenders=KALENDERS_STANDAARD.map(k=>Object.assign({},k));
  if(!state.voorraad) state.voorraad=VOORRAAD_STANDAARD.slice();
  if(!state.kastNodig) state.kastNodig={};
  if(!state.overrides) state.overrides={};
  if(!state.planV2){
    // oude planning stond op dagnummer; nu op datum, zodat periodes bewaard blijven
    const oud=state.plan||{}, nieuw={};
    Object.entries(oud).forEach(([k,v])=>{
      const m=k.match(/^d(\d+)-(\w+)$/);
      if(m&&state.start) nieuw[isoVan(addDays(state.start,Number(m[1])))+'|'+m[2]]=v;
      else nieuw[k]=v;
    });
    state.plan=nieuw; state.planV2=true;
  }
  if(state.zoekUrl===undefined) state.zoekUrl=ZOEK_STANDAARD;
  if(!state.plan||!Object.keys(state.plan).length) genereer(true);
  const vb=document.getElementById('versie');
  if(vb) vb.textContent='v'+VERSIE;
  const sb=document.getElementById('sync');
  if(sb) sb.onclick=badgeKlik;
  render();
  setSync();
  startPolling();
  autoWedstrijden();

  // Installeerbaar maken en offline laten werken. Lukt alleen op een echte
  // website met https; elders faalt dit stil en verandert er niets.
  if('serviceWorker' in navigator && location.protocol==='https:'){
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  }
})();
</script>
</body>
